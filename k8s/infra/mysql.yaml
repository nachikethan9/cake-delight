apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: cake-delight
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS catalog_db;
    CREATE DATABASE IF NOT EXISTS order_db;
    CREATE DATABASE IF NOT EXISTS rating_db;
    CREATE DATABASE IF NOT EXISTS notification_db;
    CREATE USER IF NOT EXISTS 'catalog_user'@'%'      IDENTIFIED BY 'catalog_pass';
    CREATE USER IF NOT EXISTS 'order_user'@'%'        IDENTIFIED BY 'order_pass';
    CREATE USER IF NOT EXISTS 'rating_user'@'%'       IDENTIFIED BY 'rating_pass';
    CREATE USER IF NOT EXISTS 'notification_user'@'%' IDENTIFIED BY 'notification_pass';
    GRANT ALL PRIVILEGES ON catalog_db.*      TO 'catalog_user'@'%';
    GRANT ALL PRIVILEGES ON order_db.*        TO 'order_user'@'%';
    GRANT ALL PRIVILEGES ON rating_db.*       TO 'rating_user'@'%';
    GRANT ALL PRIVILEGES ON notification_db.* TO 'notification_user'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: cake-delight
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: cake-delight
  labels: { app: mysql }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef: { name: mysql-root }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: init
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cake-delight
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
