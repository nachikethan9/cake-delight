# NOTE: plain Secrets are only base64-encoded. Committing them is acceptable for this
# local capstone only. Production would use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-root
  namespace: cake-delight
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpass"
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
  namespace: cake-delight
type: Opaque
stringData:
  DB_USERNAME: "catalog_user"
  DB_PASSWORD: "catalog_pass"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db
  namespace: cake-delight
type: Opaque
stringData:
  DB_USERNAME: "order_user"
  DB_PASSWORD: "order_pass"
---
apiVersion: v1
kind: Secret
metadata:
  name: rating-db
  namespace: cake-delight
type: Opaque
stringData:
  DB_USERNAME: "rating_user"
  DB_PASSWORD: "rating_pass"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-db
  namespace: cake-delight
type: Opaque
stringData:
  DB_USERNAME: "notification_user"
  DB_PASSWORD: "notification_pass"
