server:
  port: 8083

spring:
  application:
    name: rating-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rating_db}
    username: ${DB_USERNAME:rating_user}
    password: ${DB_PASSWORD:rating_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}