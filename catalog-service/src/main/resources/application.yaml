server:
  port: 8081

spring:
  application:
    name: catalog-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always