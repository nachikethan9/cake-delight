name: cake-delight

services:

  # ------------------------------------------------ infrastructure
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"            # host 3307 -> avoids clashing with your local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"            # web inbox

  # ------------------------------------------------ microservices
  catalog-service:
    build: ./catalog-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: catalog_pass
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 512m

  rating-service:
    build: ./rating-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/rating_db
      DB_USERNAME: rating_user
      DB_PASSWORD: rating_pass
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 512m

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_pass
      CATALOG_SERVICE_URL: http://catalog-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
    mem_limit: 512m

  notification-service:
    build: ./notification-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    mem_limit: 512m

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"            # the ONLY service exposed to your laptop
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      RATING_SERVICE_URL: http://rating-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - catalog-service
      - order-service
      - rating-service
      - notification-service
    mem_limit: 384m

volumes:
  mysql-data: